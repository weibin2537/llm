global:
  namespace: chatbox
  domain: myapp.local

frontend:
  enabled: true
  image:
    repository: localhost:5000/chatbox-frontend
    tag: latest
    pullPolicy: Always
  service:
    port: 80
    targetPort: 3000
  resources:
    limits:
      cpu: 300m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

backend:
  enabled: true
  image:
    repository: localhost:5000/chatbox-backend
    tag: latest
    pullPolicy: Always
  service:
    port: 8000
    targetPort: 8000
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 512Mi

model:
  enabled: true
  image:
    repository: localhost:5000/chatbox-model
    tag: latest
    pullPolicy: Always
  service:
    port: 11434
    targetPort: 11434
  resources:
    # Reduced resource requirements for smaller model
    limits:
      cpu: 1000m
      memory: 6Gi
    requests:
      cpu: 500m
      memory: 4Gi

istio:
  enabled: true
  gateway:
    name: chatbox-gateway
    selector:
      istio: ingressgateway
  hosts:
    - myapp.local

monitoring:
  enabled: true
  prometheus:
    scrapeInterval: 15s
  alertRules:
    cpuUsage:
      threshold: 80
    memoryUsage:
      threshold: 80
