{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chatbox.backend.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chatbox.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "chatbox.backend.fullname" . }}
spec:
  replicas: {{ .Values.backend.replicaCount | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "chatbox.backend.fullname" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "chatbox.backend.fullname" . }}
      annotations:
        sidecar.istio.io/inject: "true"
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: {{ include "chatbox.backend.fullname" . }}
        image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
        imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.backend.service.targetPort }}
          name: http
        resources:
          {{- toYaml .Values.backend.resources | nindent 12 }}
        env:
        - name: MODEL_SERVICE_URL
          value: "http://{{ include "chatbox.model.fullname" . }}:{{ .Values.model.service.port }}"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "chatbox.backend.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chatbox.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "chatbox.backend.fullname" . }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "chatbox.backend.fullname" . }}
  ports:
    - protocol: TCP
      port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.targetPort }}
      name: http
{{- end }}
