apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: {{ .Values.istio.gateway.name }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    {{ toYaml .Values.istio.gateway.selector | nindent 4 }}
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    {{- range .Values.istio.hosts }}
    - {{ . | quote }}
    {{- end }}
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: chatbox-vs
  namespace: {{ .Release.Namespace }}
spec:
  hosts:
  {{- range .Values.istio.hosts }}
  - {{ . | quote }}
  {{- end }}
  gateways:
  - {{ .Values.istio.gateway.name }}
  http:
  - match:
    - uri:
        exact: /chat
    - uri:
        prefix: /chat/
    route:
    - destination:
        host: {{ include "chatbox.backend.fullname" . }}
        port:
          number: {{ .Values.backend.service.port }}
  - match:
    - uri:
        exact: /api
    - uri:
        prefix: /api/
    route:
    - destination:
        host: {{ include "chatbox.model.fullname" . }}
        port:
          number: {{ .Values.model.service.port }}
  - route:
    - destination:
        host: {{ include "chatbox.frontend.fullname" . }}
        port:
          number: {{ .Values.frontend.service.port }}
